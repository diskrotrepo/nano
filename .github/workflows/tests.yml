name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # torchcodec loads the system FFmpeg shared libs at import time.
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --frozen pins to uv.lock exactly (fails if the lock is stale).
      # --extra dev pulls in pytest.
      - name: Install dependencies
        run: uv sync --frozen --extra dev

      # Default suite only; the `benchmark` marker is opt-in (pyproject addopts).
      - name: Run unit tests
        run: uv run --no-sync python -m pytest
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
